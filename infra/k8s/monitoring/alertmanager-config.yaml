# GhostOps — Alertmanager Configuration
# Minimal config with a "null" receiver — alerts are accepted and silently
# dropped for now.  Wire this to the FastAPI webhook receiver later by
# adding a webhook_configs entry under the "ghostops-webhook" receiver.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: ghostops
data:
  alertmanager.yml: |
    # =============================================================
    # Alertmanager — minimal config (no real receiver yet)
    # =============================================================
    global:
      resolve_timeout: 5m

    route:
      receiver: "null"
      group_by: ["alertname", "severity"]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h

    receivers:
      - name: "null"
        # No notification targets configured.
        # TODO: add webhook_configs pointing to the FastAPI ingestion service
        #       once that service is deployed.
