# Exposes Grafana on NodePort 30030, like Prometheus (30090) and Alertmanager (30080).
# On kind this is mapped to localhost:3000 (infra/kind/kind-config.yaml); on the Oracle VM
# Caddy serves it over HTTPS and the Oracle firewall keeps the NodePort private.
apiVersion: v1
kind: Service
metadata:
  name: grafana-edge
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
