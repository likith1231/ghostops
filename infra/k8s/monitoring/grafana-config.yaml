# ==========================================================================
# Grafana Provisioning — Datasources + Dashboard Provider
# ==========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ghostops
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      # Prometheus — for cluster metrics (memory, CPU, alerts)
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false

      # GhostOps API — JSON API datasource for incident data
      # Points at the FastAPI backend running on the host
      - name: GhostOps-API
        type: marcusolsson-json-datasource
        access: proxy
        # The backend runs on the host machine at port 8000.
        # From inside the kind cluster, reach it via the Docker bridge gateway.
        url: http://172.18.0.1:8000
        editable: false
        jsonData:
          queryString: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ghostops
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "GhostOps"
        orgId: 1
        folder: "GhostOps"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false
