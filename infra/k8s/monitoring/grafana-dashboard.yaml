apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: ghostops
data:
  ghostops-incidents.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Total Incidents",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [{ "jsonPath": "$.total", "name": "Total" }],
              "method": "GET",
              "urlPath": "/api/incidents/summary"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "blue", "value": null },
                  { "color": "blue", "value": 0 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "title": "Validation Pass Rate",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [{ "jsonPath": "$.pass_rate", "name": "Pass Rate" }],
              "method": "GET",
              "urlPath": "/api/incidents/summary"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "green", "value": 80 }
                ]
              },
              "unit": "percent",
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 3,
          "title": "Passed",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [{ "jsonPath": "$.passed", "name": "Passed" }],
              "method": "GET",
              "urlPath": "/api/incidents/summary"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "green", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Failed",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [{ "jsonPath": "$.failed", "name": "Failed" }],
              "method": "GET",
              "urlPath": "/api/incidents/summary"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "PRs Created",
          "type": "stat",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [{ "jsonPath": "$.prs_created", "name": "PRs" }],
              "method": "GET",
              "urlPath": "/api/incidents/summary"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [{ "color": "purple", "value": null }]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Recent Incidents",
          "type": "table",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "marcusolsson-json-datasource", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "marcusolsson-json-datasource" },
              "fields": [
                { "jsonPath": "$[*].timestamp", "name": "Timestamp" },
                { "jsonPath": "$[*].alert_type", "name": "Alert Type" },
                { "jsonPath": "$[*].root_cause", "name": "Root Cause" },
                { "jsonPath": "$[*].confidence", "name": "Confidence" },
                { "jsonPath": "$[*].validation_passed", "name": "Validated" },
                { "jsonPath": "$[*].pr_created", "name": "PR Created" },
                { "jsonPath": "$[*].pr_url", "name": "PR URL" },
                { "jsonPath": "$[*].outcome_summary", "name": "Outcome" }
              ],
              "method": "GET",
              "urlPath": "/api/incidents/recent?limit=20"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Validated" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "❌ Fail", "color": "red" }, "1": { "text": "✅ Pass", "color": "green" } } }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "PR Created" },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "No" }, "1": { "text": "Yes" } } }
                    ]
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "PR URL" },
                "properties": [
                  { "id": "links", "value": [{ "title": "Open PR", "url": "${__value.text}", "targetBlank": true }] }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [{ "displayName": "Timestamp", "desc": true }]
          }
        },
        {
          "id": 7,
          "title": "Sample App Memory (from Prometheus)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "" },
          "targets": [
            {
              "refId": "A",
              "expr": "container_memory_working_set_bytes{pod=~\"sample-app.*\"}",
              "legendFormat": "{{pod}} working set"
            },
            {
              "refId": "B",
              "expr": "container_spec_memory_limit_bytes{pod=~\"sample-app.*\"}",
              "legendFormat": "{{pod}} limit"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "drawStyle": "line",
                "showPoints": "auto",
                "pointSize": 5
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["ghostops", "aiops", "incidents"],
      "templating": { "list": [] },
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "GhostOps — Incident Dashboard",
      "uid": "ghostops-incidents",
      "version": 1
    }
