# Exposes Grafana on the VM at 127.0.0.1:30030 so the VM's Caddy can serve it over HTTPS.
# (Prometheus and Alertmanager already have NodePorts 30090 and 30080; the Oracle firewall
# keeps all of these private to the VM.)
apiVersion: v1
kind: Service
metadata:
  name: grafana-edge
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
